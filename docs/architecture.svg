<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="626" viewBox="0 0 940 420" role="img"
         aria-label="A browser or API client calls one Cloud Run service in us-central1. That service calls Gemini 3.5 Flash and Gemma 4 on Vertex AI, with identifiers removed before the call. It stores state and future scheduled work in Firestore. Cloud Scheduler checks for due work every minute. Agent Registry provides scope-checked discovery. The output is a cited draft that a pharmacist reviews."><rect width="940" height="420" fill="#ffffff"/>
      <defs>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#11151c"></path>
        </marker>
        <marker id="arw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f3d9e"></path>
        </marker>
      </defs>

      <g font-family="IBM Plex Sans, sans-serif" fill="#11151c">

        <!-- Vertex AI -->
        <rect x="330" y="24" width="300" height="76" rx="6" fill="#ffffff" stroke="#a8b0bb"></rect>
        <text x="480" y="52" font-size="15" font-weight="600" text-anchor="middle">Vertex AI</text>
        <text x="480" y="74" font-size="12.5" fill="#5d6470" text-anchor="middle">Gemini 3.5 Flash reads the report</text>
        <text x="480" y="90" font-size="12.5" fill="#5d6470" text-anchor="middle">Gemma 4 checks it for identifiers</text>

        <!-- Browser -->
        <rect x="24" y="168" width="164" height="76" rx="6" fill="#ffffff" stroke="#a8b0bb"></rect>
        <text x="106" y="196" font-size="15" font-weight="600" text-anchor="middle">Browser</text>
        <text x="106" y="218" font-size="12.5" fill="#5d6470" text-anchor="middle">or API client</text>
        <text x="106" y="234" font-size="12.5" fill="#5d6470" text-anchor="middle">no login needed</text>

        <!-- Cloud Run -->
        <rect x="252" y="148" width="456" height="116" rx="7" fill="#ecebf8" stroke="#3f3d9e" stroke-width="1.6"></rect>
        <text x="480" y="178" font-size="15" font-weight="600" text-anchor="middle">Cloud Run &#183; day-three</text>
        <text x="480" y="199" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5d6470" text-anchor="middle">us-central1 &#183; scales to zero</text>
        <line x1="286" y1="216" x2="674" y2="216" stroke="#a8b0bb"></line>
        <text x="480" y="236" font-size="12.5" text-anchor="middle">Read &#8594; Curate &#8594; Aggregate &#8594; Wait &#8594; Reconcile &#8594; Verify</text>
        <text x="480" y="254" font-size="11.5" fill="#5d6470" text-anchor="middle">nine bounded roles, one service</text>

        <!-- Pharmacist -->
        <rect x="756" y="168" width="160" height="76" rx="6" fill="#ffffff" stroke="#11151c" stroke-width="1.6"></rect>
        <text x="836" y="196" font-size="15" font-weight="600" text-anchor="middle">Pharmacist</text>
        <text x="836" y="218" font-size="12.5" fill="#5d6470" text-anchor="middle">reviews and decides.</text>
        <text x="836" y="234" font-size="12.5" fill="#5d6470" text-anchor="middle">Nothing acts alone.</text>

        <!-- Bottom row: all three sit under Cloud Run so no connector crosses anything -->
        <rect x="252" y="330" width="143" height="80" rx="6" fill="#ffffff" stroke="#a8b0bb"></rect>
        <text x="323" y="356" font-size="13.5" font-weight="600" text-anchor="middle">Agent Registry</text>
        <text x="323" y="377" font-size="11.5" fill="#5d6470" text-anchor="middle">8 entries.</text>
        <text x="323" y="393" font-size="11.5" fill="#5d6470" text-anchor="middle">Other teams need</text>
        <text x="323" y="405" font-size="11.5" fill="#5d6470" text-anchor="middle">the right scope.</text>

        <rect x="408" y="330" width="143" height="80" rx="6" fill="#ffffff" stroke="#a8b0bb"></rect>
        <text x="479" y="356" font-size="13.5" font-weight="600" text-anchor="middle">Firestore</text>
        <text x="479" y="377" font-size="11.5" fill="#5d6470" text-anchor="middle">the antibiogram,</text>
        <text x="479" y="393" font-size="11.5" fill="#5d6470" text-anchor="middle">and work due</text>
        <text x="479" y="405" font-size="11.5" fill="#5d6470" text-anchor="middle">days from now</text>

        <rect x="564" y="330" width="143" height="80" rx="6" fill="#ffffff" stroke="#3f3d9e"></rect>
        <text x="635" y="356" font-size="13.5" font-weight="600" fill="#3f3d9e" text-anchor="middle">Cloud Scheduler</text>
        <text x="635" y="379" font-size="11.5" fill="#3f3d9e" text-anchor="middle">checks for work</text>
        <text x="635" y="395" font-size="11.5" fill="#3f3d9e" text-anchor="middle">that has come due</text>

        <!-- Arrows -->
        <line x1="190" y1="200" x2="248" y2="200" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>

        <line x1="480" y1="146" x2="480" y2="104" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>
        <text x="492" y="130" font-size="12" fill="#5d6470">identifiers removed first</text>

        <line x1="710" y1="200" x2="752" y2="200" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>
        <text x="731" y="188" font-size="11.5" fill="#5d6470" text-anchor="middle">draft</text>

        <line x1="323" y1="292" x2="323" y2="266" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>
        <line x1="323" y1="312" x2="323" y2="326" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>
        <text x="323" y="307" font-size="11.5" fill="#5d6470" text-anchor="middle">scope checks</text>

        <line x1="479" y1="292" x2="479" y2="266" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>
        <line x1="479" y1="312" x2="479" y2="326" stroke="#11151c" stroke-width="1.5" marker-end="url(#arw)"></line>
        <text x="479" y="307" font-size="11.5" fill="#5d6470" text-anchor="middle">reads and writes</text>

        <line x1="635" y1="326" x2="635" y2="312" stroke="#3f3d9e" stroke-width="1.8"></line>
        <line x1="635" y1="292" x2="635" y2="268" stroke="#3f3d9e" stroke-width="1.8" marker-end="url(#arw-a)"></line>
        <text x="635" y="307" font-size="11.5" font-weight="600" fill="#3f3d9e" text-anchor="middle">wakes it up</text>
      </g>
    </svg>